[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clv_causal"
version = "0.1.0"
description = "Enterprise Probabilistic CLV & Causal Impact Decision Platform"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "pandas",
    "numpy",
    "duckdb",
    "scipy",
    "lifetimes",
    "streamlit",
    "plotly",
    "openpyxl",
    "linearmodels"
]

[project.scripts]
run-pipeline = "clv_causal.run_pipeline:run_full_pipeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fulldata: marks tests that require the full warehouse, raw xlsx, or the 4,933-customer population",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402", "E741", "W291", "W293", "F841"]



