name: 'clv_causal_dbt'
version: '1.0.0'
config-version: 2

profile: 'clv_causal'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "{% if env_var('SAMPLE', '0') == '1' %}CREATE OR REPLACE TABLE raw_online_retail AS SELECT * FROM 'data/sample/online_retail_II_sample.parquet'{% endif %}"

models:
  clv_causal_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
